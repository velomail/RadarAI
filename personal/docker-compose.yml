services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_job_funnel
    restart: always
    ports:
      - "5678:5678"
    volumes:
      # Mount the repo root so file-based scripts (data/, scripts/) are reachable.
      - "../:/home/node/.n8n-files"
      - n8n_storage:/home/node/.n8n
    env_file:
      - .env
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - GENERIC_TIMEZONE=America/Toronto
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n-files/
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path
      - LINKEDIN_RAPIDAPI_HOST=${LINKEDIN_RAPIDAPI_HOST:-}
      - LINKEDIN_RAPIDAPI_KEY=${LINKEDIN_RAPIDAPI_KEY:-}
      - LINKEDIN_QUERY_PATH=${LINKEDIN_QUERY_PATH:-/search}
      - LINKEDIN_QUERY_PARAM=${LINKEDIN_QUERY_PARAM:-keyword}
      - LINKEDIN_LOCATION_PARAM=${LINKEDIN_LOCATION_PARAM:-location}
      - LINKEDIN_LOCATION=${LINKEDIN_LOCATION:-Canada}

volumes:
  n8n_storage:
